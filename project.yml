name: PersonalBrowser
options:
  bundleIdPrefix: local.personalbrowser
  deploymentTarget:
    macOS: '26.0'
  createIntermediateGroups: true
packages:
  BrowserKit:
    path: Packages/BrowserKit
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    DEVELOPMENT_TEAM: ''
targets:
  PersonalBrowser:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS
        excludes: [Resources/AppIcon.icon]
      - path: Apps/macOS/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: BrowserKit
        product: BrowserCore
      - package: BrowserKit
        product: BrowserEngine
      - package: BrowserKit
        product: ProductivityKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.personalbrowser.mac
        PRODUCT_NAME: Oriv
        PRODUCT_MODULE_NAME: PersonalBrowser
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Oriv
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: Oriv
        INFOPLIST_KEY_NSCameraUsageDescription: Allow websites you choose to use your camera.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Allow websites you choose to use your microphone.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoadsInWebContent: YES
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/PersonalBrowser.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: '0.5.0'
        CURRENT_PROJECT_VERSION: '5'
    info:
      path: Apps/macOS/Resources/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        CFBundleURLTypes:
          - CFBundleURLName: Web addresses
            CFBundleURLSchemes: [http, https]
        NSPrincipalClass: NSApplication
  BrowserMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/BrowserMacTests]
    dependencies:
      - target: PersonalBrowser
      - package: BrowserKit
        product: BrowserCore
      - package: BrowserKit
        product: BrowserEngine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Oriv.app/Contents/MacOS/Oriv
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  PersonalBrowser:
    build:
      targets:
        PersonalBrowser: all
        BrowserMacTests: [test]
    test:
      targets: [BrowserMacTests]
      environmentVariables:
        BROWSER_TESTING: '1'
